plugins { id 'com.android.application' }

android {
    namespace 'com.fjnova.calculadora'
    compileSdk 36
    defaultConfig { applicationId 'com.fjnova.calculadora'; minSdk 23; targetSdk 36; versionCode 2; versionName '1.0.1' }
    signingConfigs { release { storeFile file(System.getenv('SIGNING_STORE_FILE')); storePassword System.getenv('SIGNING_STORE_PASSWORD'); keyAlias System.getenv('SIGNING_KEY_ALIAS'); keyPassword System.getenv('SIGNING_KEY_PASSWORD') } }
    buildTypes { release { minifyEnabled false; shrinkResources false; signingConfig signingConfigs.release } debug { debuggable true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
